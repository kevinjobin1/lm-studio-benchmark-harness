name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  dashboard-build:
    name: Build Dashboard
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/dashboard

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('apps/dashboard/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npx vitest run

      - name: Build Astro site
        run: bun run build

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/dashboard/dist

  python-validate:
    name: Validate Python
    runs-on: ubuntu-latest
    # Full benchmark suite requires LM Studio on macOS — see benchmark.yml for scheduled runs

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff mypy pytest pytest-cov

      - name: Ruff lint
        run: ruff check packages/ apps/cli/ tests/

      - name: Ruff format check
        run: ruff format --check --diff packages/ apps/cli/ tests/

      - name: Mypy type check
        run: MYPYPATH=packages mypy packages/ apps/cli/

      - name: Validate imports (fast-fail smoke test)
        run: |
          PYTHONPATH=packages:$PYTHONPATH python -c "
          from core import BenchmarkSuite, BenchmarkResult
          from providers import OllamaClient, OpenAICompatibleProvider
          from events import EventBus, TokenGeneratedEvent, CompletionEvent, MetricEvent
          print('All core modules imported successfully.')
          "

      - name: Run Python tests
        run: pytest tests/ -v --tb=short

      - name: Validate config schema
        run: |
          python -c "
          import json
          with open('apps/cli/config_schema.json') as f:
              schema = json.load(f)
          assert 'properties' in schema, 'Invalid JSON schema'
          print(f'Config schema valid. Top-level keys: {list(schema.get(\"properties\", {}).keys())}')
          "

  deploy:
    name: Deploy to GitHub Pages
    needs: [dashboard-build, python-validate]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  docs-build:
    name: Build Docs Site
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/docs

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-docs-${{ hashFiles('apps/docs/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-docs-

      - name: Install dependencies
        run: bun install

      - name: Build Starlight docs
        run: bun run build

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-dist
          path: apps/docs/dist
          retention-days: 1

  docs-deploy:
    name: Deploy Docs to Cloudflare Pages
    needs: [docs-build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download docs artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-dist
          path: apps/docs/dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/docs/dist --project-name modellens-docs

  sse-bridge:
    name: Build & Deploy SSE Bridge Worker
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/sse-bridge

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/sse-bridge/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Deploy to Cloudflare Workers
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          workingDirectory: apps/sse-bridge
