api:
  api_key: lm-studio
  base_url: http://localhost:1234/v1
  max_retries: 3
  model_name: local-model
  timeout: 120
cache:
  cache_dir: results/cache
devbench:
  description: "DevBench v2 \u2014 TypeScript/NestJS/React evaluation"
  endpoint:
    api_key: lm-studio
    base_url: http://localhost:1234/v1
    timeout: 30
  evaluation:
    execution_grounded:
      enabled: true
      eslint: true
      ts_node: true
      tsc: true
    max_workers: 3
    parallel_execution: true
    runs_per_prompt: 5
    statistical:
      confidence_interval: 0.95
      outlier_detection: true
      outlier_method: iqr
  generation:
    max_tokens: 1000
    stream: true
    temperature: 0.2
    top_p: 0.9
  hardware:
    architecture: arm64
    memory_gb: 18
    target: apple_silicon
  metrics:
    normalization_reference_length: 100
    tokenization_aware: true
    track_latency: true
    track_memory: true
    track_thermal: false
  models:
    auto_detect: true
    metadata_fields:
    - size
    - quantization
    - parameters
  output:
    charts:
    - radar
    - leaderboard
    directory: devbench_results
    formats:
    - json
    - csv
    - markdown
  prompts:
    categories:
      code:
        count: 8
        enabled: true
        subcategories:
        - nestjs
        - react
        - typescript
        weight: 0.4
      debugging:
        count: 1
        enabled: true
        subcategories:
        - race_condition
        - di_bug
        - stale_closure
        weight: 0.05
      frontend:
        count: 4
        enabled: true
        subcategories:
        - react
        - threejs
        - tailwind
        weight: 0.2
      instruction:
        count: 1
        enabled: true
        subcategories:
        - json
        - formatting
        weight: 0.05
      math:
        count: 3
        enabled: true
        subcategories:
        - developer_math
        weight: 0.15
      reasoning:
        count: 3
        enabled: true
        subcategories:
        - architecture
        - system_design
        weight: 0.15
    difficulty_distribution:
      easy: 0.3
      hard: 0.2
      medium: 0.5
    generator: auto
    total_count: 20
  reproducibility:
    deterministic: false
    seed: null
    version_prompts: true
general:
  benchmarks:
    aime:
      enabled: true
    bfcl:
      categories:
      - simple
      - multi_turn
      - parallel
      enabled: true
    creativity:
      enabled: true
      prompts_file: data/creativity_prompts.json
    gsm8k:
      enabled: true
    humaneval:
      enabled: true
    ifeval:
      enabled: true
    memory:
      enabled: true
      monitor_interval: 1.0
    mmlu_pro:
      enabled: true
      subjects:
      - math
      - physics
      - chemistry
      - biology
      - computer_science
    needle_in_haystack:
      context_lengths:
      - 4000
      - 8000
      - 16000
      - 32000
      enabled: true
    speed_latency:
      enabled: true
      prompt_lengths:
      - 100
      - 500
      - 1000
      - 2000
    swe_bench_lite:
      enabled: true
      max_tasks: 20
  quick_mode_samples: 10
  samples_per_benchmark: 100
model:
  max_tokens: 4096
  temperature: 0.0
  top_p: 1.0
output:
  directory: results
  formats:
  - json
  - csv
  - html
  save_intermediate: true
  verbose: true
version: 2.0.0
