repos:
  # ── Basic file hygiene ────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]

  # ── Ruff lint (auto-fix safe issues) ──────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # ── Mypy type check (mirrors CI: MYPYPATH=packages) ───────────────
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: bash -c 'MYPYPATH=packages mypy packages/ apps/cli/'
        language: system
        types: [python]
        pass_filenames: false
