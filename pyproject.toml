[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "model-lens"
version = "0.1.0"
description = "Observability and evaluation platform for local AI models"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "openai>=1.12.0",
    "click>=8.1.7",
    "rich>=13.7.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "psutil>=5.9.8",
    "tqdm>=4.66.0",
    "pyyaml>=6.0.1",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "datasets>=2.18.0",
    "transformers>=4.38.0",
    "torch>=2.2.0",
    "jinja2>=3.1.3",
    "lm-eval>=0.4.0",
    "accelerate>=0.26.0",
    "sentencepiece>=0.1.99",
    "protobuf>=4.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4.0",
    "mypy>=1.0",
]

[project.scripts]
modellens = "apps.cli.modellens:cli"

[project.urls]
Homepage = "https://github.com/kevinjobin1/model-lens"
Repository = "https://github.com/kevinjobin1/model-lens"
Issues = "https://github.com/kevinjobin1/model-lens/issues"

[tool.setuptools.packages.find]
where = ["packages"]

[tool.setuptools.package-dir]
apps = "apps"

# ── Ruff configuration ────────────────────────────────────────────
[tool.ruff]
target-version = "py310"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line-too-long (handled by formatter)
    "B008",  # do-not-call-async-in-sync (common in CLI init)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["core", "benchmarks", "providers", "skills", "apps"]

# ── Pytest configuration ───────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages", "."]
addopts = "-v --tb=short"

# ── Mypy configuration ────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
